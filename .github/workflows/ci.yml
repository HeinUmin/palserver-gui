name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @palserver/agent exec tsx --test src/docker-build.test.ts src/docker-config.test.ts
      - run: pnpm build

  docker-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Agent image
        run: docker build -t palserver/agent:ci -f packages/agent/Dockerfile .
      - name: Check game-user permissions and Docker config paths
        run: docker run --rm --network none palserver/agent:ci node --test packages/agent/dist/docker-config.test.js
      - name: Check image contents and Agent startup without external network
        run: >-
          docker run --rm --network none --tmpfs /tmp
          -e PALSERVER_DATA_DIR=/tmp/palserver-smoke
          -e PALSERVER_NO_OPEN=1
          --mount type=bind,src="${{ github.workspace }}/scripts/smoke-agent-image.mjs",dst=/app/smoke-agent-image.mjs,readonly
          palserver/agent:ci node /app/smoke-agent-image.mjs
      - name: Build vanilla game image through the Agent Docker API
        run: >-
          docker run --rm
          --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock
          --mount type=bind,src="${{ github.workspace }}/scripts/smoke-game-build.mjs",dst=/app/scripts/smoke-game-build.mjs,readonly
          palserver/agent:ci node /app/scripts/smoke-game-build.mjs
